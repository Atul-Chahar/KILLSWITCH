<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="KILLSWITCH: a leaked-credential responder. It catches an AWS key the moment it escapes, shows what the attacker did, and after one human approval kills the key."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- The submission link gets pasted into forms, chats and timelines. Without these it
         renders as a bare URL; with them it carries the console's own screenshot. The
         image URL has to be absolute — every scraper resolves it from its own host. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KILLSWITCH" />
    <meta property="og:url" content="https://killswitch-console.onrender.com/" />
    <meta property="og:title" content="KILLSWITCH — your AWS keys leaked. It pulls the plug." />
    <meta
      property="og:description"
      content="Scan any public GitHub repository for exposed AWS credentials, live in your browser. Then see the whole response: blast radius from CloudTrail, a plan the model proposes, plain code that verifies it, and a human who approves."
    />
    <meta property="og:image" content="https://killswitch-console.onrender.com/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The KILLSWITCH console, showing a containment plan awaiting approval." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KILLSWITCH — your AWS keys leaked. It pulls the plug." />
    <meta
      name="twitter:description"
      content="Scan any public GitHub repository for exposed AWS credentials, live in your browser."
    />
    <meta name="twitter:image" content="https://killswitch-console.onrender.com/social-card.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>KILLSWITCH</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
